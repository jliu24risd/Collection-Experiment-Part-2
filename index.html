<!DOCTYPE html>
<html>
<head>
  <title>What Is Valuable To You?</title>
  <style>
    body {
      font-family: Futura, Arial, sans-serif;
      margin: 40px;
      background-color: #e5f87a;
      background-image:
        linear-gradient(#f4d6df 1px, transparent 1px),
        linear-gradient(90deg, #f4d6df 1px, transparent 1px);
      background-size: 30px 30px;
    }
    h1 {
      text-align: center;
    }
    p {
      text-align: center;
    }
    .buttons {
      text-align: center;
      margin: 25px;
    }
    button {
      font-family: inherit;
      padding: 8px 12px;
    }
    #collection {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 25px;
    }
    .item {
      width: 180px;
      transition: 0.5s;
    }
    .item img {
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>WHAT IS VALUABLE TO YOU?</h1>
  <p>
    These are works I saw at MoMA.<br>
    Click an image and give it a personal value from 1–5.<br>
    Is there an imposter among them?
  </p>

  <div class="buttons">
    <button onclick="randomize()">RANDOM?</button>
  </div>
  
  <div id="collection">
    <div class="item">
      <img src="pieces/waterlilies.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/threepuppies.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/streetandthestore.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/starrynight.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/seraut.jpg"
           onclick="rate(this)">
    </div>
    
    <div class="item">
      <img src="pieces/rothko.png"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/pollock.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/picasso.png"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/persistenceofmemory.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/mondrianchair.png"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/garbagecan.jpg"
           onclick="rate(this)">
    </div>
    
    <div class="item">
      <img src="pieces/falsemirror.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/chickensoup.jpg"
           onclick="rate(this)">
    </div>

    <div class="item">
      <img src="pieces/actuallymine.jpeg"
           onclick="rate(this)">

    </div>

  </div>

  <script>

    const collection =
      document.getElementById("collection");

    const items =
      document.querySelectorAll(".item");

    function rate(image) {
      let value =
        prompt("How much do you value this work? 1–5");
      let item =
        image.parentElement;
      if (value == 1) {
        item.style.width = "100px";
      }
      if (value == 2) {
        item.style.width = "200px";
      }
      if (value == 3) {
        item.style.width = "300px";
      }
      if (value == 4) {
        item.style.width = "400px";
      }
      if (value == 5) {
        item.style.width = "500px";
      }

    }

    function randomize() {

      let list =
        Array.from(items);
      list.sort(function() {
        return Math.random() - 0.5;
      });

      list.forEach(function(item) {
        collection.appendChild(item);
      });
    }

  </script>

</body>

</html>
